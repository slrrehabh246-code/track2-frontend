<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track 2 - الدفع وتتبع الطلب</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f6f8; padding: 20px; direction: rtl; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 500px; margin: 0 auto 20px; }
        h2 { margin-top: 0; color: #333; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .status-box { background: #eef6ff; padding: 12px; border-radius: 6px; margin-top: 10px; font-weight: bold; color: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <h2>1. إرسال عملية دفع</h2>
        <input type="text" id="orderId" placeholder="رقم الطلب (Order ID)">
        <input type="number" id="amount" placeholder="المبلغ">
        <button onclick="submitPayment()">تأكيد الدفع</button>
        <div id="paymentResult"></div>
    </div>

    <div class="card">
        <h2>2. تتبع حالة الطلب</h2>
        <input type="text" id="trackOrderId" placeholder="أدخل رقم الطلب للبحث">
        <button onclick="trackOrder()">تتبع الطلب</button>
        <div id="trackResult"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
